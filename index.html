<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}

.pm{font-size:12px;margin:6px 4px 0;font-weight:600}
main{max-width:720px;margin:0 auto;padding:14px 12px}
.ann{background:var(--card);box-shadow:var(--sh);color:var(--tx);border-radius:14px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.info{background:var(--card);box-shadow:var(--sh);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.card{background:var(--card);box-shadow:var(--sh);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bd);display:block}
.cb{padding:10px;display:flex;flex-direction:column;gap:5px;flex:1}
.nm{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc{color:var(--rd);font-weight:800;font-size:17px}
.pc s{color:var(--mu);font-weight:400;font-size:12px;margin-left:4px}
.btn{border:0;border-radius:22px;background:linear-gradient(135deg,#ff8a00,#ff4d2e);color:#fff;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
.btn.g{background:var(--bd);color:var(--tx)}
.btn.r{background:var(--rd)}
.box{background:var(--card);box-shadow:var(--sh);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.row img{width:58px;height:58px;border-radius:12px;object-fit:cover}
.row .f{flex:1;min-width:0}
input,textarea,select{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px;font:inherit;margin-bottom:8px}
label{font-size:12px;color:var(--mu)}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 4px 24px rgba(0,0,0,.18);border-radius:22px;display:flex;z-index:6;max-width:520px;margin:0 auto}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0;font-size:11px;cursor:pointer}
nav button.on{color:var(--or);font-weight:700}
nav span{display:block;font-size:20px}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{white-space:nowrap}
.tot div{display:flex;justify-content:space-between;margin:4px 0}
.big{font-size:18px;font-weight:800}
.q{display:flex;align-items:center;gap:8px}
.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--bd);background:none;color:var(--tx);font-size:16px}
.mu{color:var(--mu);font-size:13px}
a{color:var(--or)}
</style>
</head>

<script>

const L=(k,d)=>{try{const x=JSON.parse(localStorage.getItem(k));return x==null?d:x}catch(e){return d}};

 di:'🚚 <b>Астана ішінде</b> жеткізу — {p}.<br>Басқа қалаларға — почта арқылы, тауарды өзіңіз алып кетесіз.<br>⏱ Тауар ~{d} күнде келеді.',
 add:'Себетке',none:'Әзірге тауар жоқ',n1:'Каталог',n2:'Себет',n3:'Профиль',n4:'Админ',empty:'Себет бос',
 dt:'Жеткізу түрі',da:'Астана — жеткізу {p}',dx:'Басқа қала — почтадан өзім аламын',dn:'Тауар ~{d} күнде келеді.',
 g:'Тауар',pr:'Промокод',dl:'Жеткізу',tot:'Жиыны',post:'почта (өзі төлейді)',ord:'WhatsApp-қа тапсырыс жіберу',
 hint:'Батырманы басқанда WhatsApp ашылады, дайын мәтінді жіберіңіз.',
 pf:'Профиль',fn:'Аты-жөні',fp:'Телефон',fc:'Қала',fa:'Мекенжай / почта бөлімшесі',fs:'Деректер тек осы құрылғыда сақталады.',

 di:'🚚 <b>По Астане</b> доставка — {p}.<br>В другие города — почтой, забираете самостоятельно.<br>⏱ Срок доставки ~{d} дней.',
 add:'В корзину',none:'Товаров пока нет',n1:'Каталог',n2:'Корзина',n3:'Профиль',n4:'Админ',empty:'Корзина пуста',
 dt:'Способ доставки',da:'Астана — доставка {p}',dx:'Другой город — заберу на почте',dn:'Товар придёт примерно через {d} дней.',

 hint:'При нажатии откроется WhatsApp, отправьте готовое сообщение.',
 pf:'Профиль',fn:'Имя и фамилия',fp:'Телефон',fc:'Город',fa:'Адрес / отделение почты',fs:'Данные хранятся только на этом устройстве.',
 need:'Сначала заполните профиль (имя, телефон, город)',
 m0:'Здравствуйте! Заказ из магазина {n}:',m1:'Товары',m2:'Промокод',m3:'Доставка',m4:'Астана',m5:'другой город, заберёт на почте',m6:'ИТОГО',m7:'Имя',m8:'Тел',m9:'Город',m10:'Адрес'}};
let lang=L('lang','kk');
const t=(k,o)=>{let x=TX[lang][k]||'';if(o)for(const q in o)x=x.replace('{'+q+'}',o[q]);return x};
let D=JSON.parse($('data').textContent);
let q='',cur=null,v='shop',tab='p',cart=L('cart',[]),promo=L('promo',''),pr=L('prof',{}),adm=false,city='ast',fm={id:0,n:'',p:'',d:'',i:''},dirty=false;
try{adm=sessionStorage.getItem('adm')=='1'}catch(e){}
const dr=L('dr',null);if(dr&&dr.s){D=dr;dirty=true}
const pc=()=>D.c.find(x=>promo&&x.code.toLowerCase()==promo.toLowerCase());
const prod=id=>D.p.find(x=>x.id==id);
const sav=()=>{S('dr',D);dirty=true};
const go=x=>{v=x;r();scrollTo(0,0)};
const sl=l=>{lang=l;S('lang',l);r()};
const dp=p=>{const c=pc();return c?Math.round(p*(100-c.pct)/100):p};

function ap(){promo=$('pci').value.trim();S('promo',promo);r()}
function lst(){const k=q.trim().toLowerCase(),a=D.p.filter(p=>!k||(p.n+' '+(p.d||'')).toLowerCase().includes(k)),h=!!pc();
 return a.length?`<div class=grid>${a.map(p=>`<div class=card onclick="openP(${p.id})" style="cursor:pointer">${p.i?`<img src="${p.i}" alt="">`:'<div class=ph></div>'}<div class=cb><div class=nm>${esc(p.n)}</div><div class=pc>${fmt(dp(p.p))}${h?`<s>${fmt(p.p)}</s>`:''}</div><button class=btn onclick="event.stopPropagation();add(${p.id})">${t('add')}</button></div></div>`).join('')}</div>`:`<div class="box mu">${t(D.p.length?'nf':'none')}</div>`}
function srch(x){q=x;if(x.trim()===CODE){adm=true;try{sessionStorage.setItem('adm','1')}catch(e){}q='';go('adm');return}
 if(v!='shop'){v='shop';r();const i=$('pi');i.focus();i.setSelectionRange(x.length,x.length)}else $('gl').innerHTML=lst()}
function openP(id){cur=id;v='prod';r();scrollTo(0,0)}
function add(id){const c=cart.find(x=>x.id==id);c?c.q++:cart.push({id,q:1});S('cart',cart);r()}
function chg(id,d){const c=cart.find(x=>x.id==id);c.q+=d;if(c.q<1)cart=cart.filter(x=>x.id!=id);S('cart',cart);r()}
function calc(){const it=cart.filter(c=>prod(c.id));const sub=it.reduce((a,c)=>a+prod(c.id).p*c.q,0);const p=pc();const ds=p?Math.round(sub*p.pct/100):0;const dl=city=='ast'&&sub?Number(D.s.del):0;return{it,sub,ds,dl,tot:sub-ds+dl}}

function order(){
 const T=calc();if(!T.it.length)return;
 if(!pr.name||!pr.phone||!pr.city){alert(t('need'));go('prof');return}
 let m=t('m0',{n:D.s.name})+'\n\n';
 T.it.forEach((c,i)=>{const p=prod(c.id);m+=(i+1)+') '+p.n+' × '+c.q+' = '+fmt(p.p*c.q)+'\n'});
 m+='\n'+t('m1')+': '+fmt(T.sub);
 if(T.ds)m+='\n'+t('m2')+' '+promo+': -'+fmt(T.ds);
 m+='\n'+t('m3')+': '+(city=='ast'?t('m4')+', '+fmt(T.dl):t('m5'));
 m+='\n'+t('m6')+': '+fmt(T.tot)+'\n\n'+t('m7')+': '+pr.name+'\n'+t('m8')+': '+pr.phone+'\n'+t('m9')+': '+pr.city+'\n'+t('m10')+': '+(pr.addr||'-');
 window.open('https://wa.me/'+D.s.wa+'?text='+encodeURIComponent(m),'_blank');
}
function out(){adm=false;try{sessionStorage.removeItem('adm')}catch(e){}go('shop')}
function pimg(f){if(!f)return;const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{try{const k=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);fm.i=c.toDataURL('image/jpeg',.72)}catch(e){alert('Фото өңделмеді: '+e.message)}URL.revokeObjectURL(u);r()};i.onerror=()=>alert('Бұл фото форматы ашылмады. JPG немесе PNG таңдаңыз.');i.src=u}
function psave(){if(!fm.n||!fm.p){alert('Атауы мен бағасын жазыңыз');return}
 const o={id:fm.id||Date.now(),n:fm.n,p:Number(fm.p),d:fm.d,i:fm.i};
 const k=D.p.findIndex(x=>x.id==o.id);k>=0?D.p[k]=o:D.p.unshift(o);
 fm={id:0,n:'',p:'',d:'',i:''};sav();r()}
function pedit(id){const p=prod(id);fm={id:p.id,n:p.n,p:p.p,d:p.d||'',i:p.i||''};r();scrollTo(0,0)}
function pdel(id){if(confirm('Өшіру?')){D.p=D.p.filter(x=>x.id!=id);sav();r()}}
function aadd(){const a=$('at').value.trim(),b=$('ar').value.trim();if(!a&&!b)return;D.a.unshift({id:Date.now(),t:a,r:b});sav();r()}
function adel(id){D.a=D.a.filter(x=>x.id!=id);sav();r()}
function cadd(){const c=$('cc').value.trim(),p=Number($('cp').value);if(!c||!(p>0&&p<=90)){alert('Код және 1-90 % жазыңыз');return}
 D.c=D.c.filter(x=>x.code.toLowerCase()!=c.toLowerCase());D.c.push({code:c,pct:p});sav();r()}
function cdel(c){D.c=D.c.filter(x=>x.code!=c);sav();r()}

 try{const a=window.claude&&await claude.use('artifact');if(!a){alert('Жариялау тек сайт иесіне қолжетімді (claude.ai аккаунтыңызбен кіріңіз)');return}
 const cl=document.documentElement.cloneNode(true);cl.querySelector('#app').innerHTML='';
 cl.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
 try{localStorage.removeItem('dr')}catch(e){}
 await a.publish('<!DOCTYPE html>\n'+cl.outerHTML)}catch(e){alert('Жариялау болмады: '+(e&&e.message||e))}
}

function shop(){
 return D.a.map(a=>`<div class=ann>📢 ${esc(lang=='ru'?(a.r||a.t):(a.t||a.r))}</div>`).join('')+

 let b='';
 if(tab=='p')b=`<div class=box><label>Атауы</label><input value="${esc(fm.n)}" oninput="fm.n=this.value"><label>Бағасы (₸)</label><input type=number value="${esc(fm.p)}" oninput="fm.p=this.value"><label>Сипаттама</label><textarea rows=3 oninput="fm.d=this.value">${esc(fm.d)}</textarea><label class="btn g" style="display:inline-block;margin-bottom:8px;position:relative;overflow:hidden;font-size:14px">📷 Фото таңдау<input type=file accept="image/*" onchange="pimg(this.files[0])" style="position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer"></label><br>${fm.i?`<img src="${fm.i}" style="width:90px;border-radius:10px;display:block;margin-bottom:8px" alt="">`:''}<button class=btn onclick="psave()">${fm.id?'Сақтау':'Қосу'}</button></div>`+
